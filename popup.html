<!DOCTYPE html>
<html>

<head>
    <title>Pointer</title>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="theme.css">
    <style>
        /* ═══════════════════════════════════════════════════════════════════════
           Pointer · Popup · 硝子

           No palette lives here. Scene, ink, glass, elevation, motion,
           radii and type all come from theme.css, which the FAB ball and the
           options page read from too. This file only says how the popup's own
           parts are cut from that material.

           The language picker is one accessible custom combobox owned directly
           by popup.js. The checkbox stays visually hidden because its native
           label and keyboard behavior drive the glass toggle without extra JS.
           ═══════════════════════════════════════════════════════════════════════ */



        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        /* Body IS the scene — .pointer-scene (theme.css) paints the same tiling
           paper ground as the options page, so both surfaces read as crops of
           one sheet. */
        body {
            width: 290px;
            padding: 22px 22px 18px;
            font-size: 13px;
            line-height: 1.5;
        }

        /* Visually hidden checkbox. No pointer-events: none — the wrapping label
           still needs native label → input click behavior. */
        .native-hidden {
            position: absolute !important;
            width: 1px !important;
            height: 1px !important;
            opacity: 0 !important;
            left: -9999px !important;
            top: 0 !important;
        }

        /* ═══════ Glass · popup panel — layout-only wrapper above the noise ═══════ */
        .paper.popup {
            position: relative;
            z-index: 1;
            width: auto;
            padding: 0;
            background: transparent;
            border-radius: 0;
            box-shadow: none;
        }

        .popup-head {
            display: flex;
            align-items: baseline;
            justify-content: space-between;
            padding-bottom: 16px;
            margin-bottom: 18px;
            border-bottom: 1px solid var(--glass-line);
        }
        .popup-head h2 {
            font-size: 13px;
            font-weight: 600;
            color: var(--ink-1);
            letter-spacing: 0.005em;
        }
        .popup-head .tag {
            font-family: var(--font-mono);
            font-size: 10px;
            color: var(--ink-4);
            letter-spacing: 0.08em;
        }
        .popup-head .tag .arrow {
            color: var(--accent);
            margin: 0 3px;
        }

        .popup-body {
            display: flex;
            flex-direction: column;
            gap: 18px;
        }

        .row {
            display: flex;
            flex-direction: column;
            gap: 8px;
            position: relative;
        }
        .row > label {
            font-size: 12px;
            font-weight: 500;
            color: var(--ink-2);
            letter-spacing: 0.005em;
        }

        /* ═══════ Field — glass chip resting on the scene ═══════
           Same material as the FAB ball, and now the same physics: the ball
           lifts off the page on hover, sinks on press and rides the spring
           back up. A chip that only swapped colors read as a picture of glass;
           a chip you can push reads as the thing itself.

           The press displacement is matched in PIXELS, not in ratio — the
           ball's scale(0.96) at 64px moves its edge ~2.6px, and 0.99 on a
           246px-wide field moves it about the same. Equal ratios would make
           the wide field lurch. */
        .field {
            width: 100%;
            padding: 11px 14px;
            font-size: 13px;
            color: var(--ink-1);
            background: var(--glass-chip);
            backdrop-filter: var(--glass-blur);
            -webkit-backdrop-filter: var(--glass-blur);
            border: none;
            border-radius: var(--r-field);
            outline: none;
            box-shadow: var(--sh-chip);
            transition: background var(--t-color), box-shadow var(--t-color),
                        transform var(--t-release);
            cursor: pointer;
            user-select: none;
            font-family: inherit;
        }
        /* Hover = floats off the paper. One pixel, not the ball's two: the
           field is wide and shallow, so the same lift reads as twice as far. */
        .field:hover {
            transform: translateY(-1px);
            background: var(--glass-chip-hover);
            box-shadow: var(--sh-chip-hover);
        }
        /* Press = pushed into the paper. Instant and linear going down
           (--t-press), spring coming back up (inherited --t-release) — the
           asymmetry is the whole gesture. */
        .field:active {
            transform: scale(0.99);
            box-shadow: var(--sh-chip-press);
            transition: transform var(--t-press), box-shadow var(--t-press);
        }
        /* Lens open = the FAB's active gesture at field scale: 濃墨 laid over
           the white specular (listed first so it paints on top of it), the
           glass body untouched, and the same soft 滲み the ball and the toggle
           bleed. Driven off aria-expanded, which popup.js already maintains. */
        .field[aria-expanded="true"] {
            background: var(--glass-chip-hover);
            box-shadow:
                inset 0 0 0 1px var(--accent-rim),
                var(--sh-chip),
                0 0 8px 0 var(--accent-glow);
        }
        /* Pressing an open field (i.e. clicking it shut) still sinks: the ink
           edge stays, the drops collapse. Needs its own rule because the
           open state and :active carry the same specificity. */
        .field[aria-expanded="true"]:active {
            box-shadow:
                inset 0 0 0 1px var(--accent-rim),
                var(--sh-chip-press);
        }
        .field:focus-visible {
            outline: 2px solid var(--accent);
            outline-offset: 2px;
        }

        .field.select {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .field.select > span:first-child {
            flex: 1;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .lang-chip {
            font-family: var(--font-mono);
            font-size: 11px;
            color: var(--ink-3);
            letter-spacing: 0.04em;
            flex-shrink: 0;
        }

        /* ═══════ Lens — glass dropdown ═══════
           position: fixed so it floats above the popup body without
           contributing to scrollHeight (which would stretch the Chrome
           popup window). popup.js computes top/left/width from
           langField.getBoundingClientRect() on open. */
        .lens {
            position: fixed;
            padding: 5px;
            z-index: 20;
            border-radius: var(--r-field);
            background: var(--glass-float);
            backdrop-filter: var(--glass-blur);
            -webkit-backdrop-filter: var(--glass-blur);
            box-shadow: var(--sh-float);
            /* max-height set by popup.js to fit inside the current
               popup viewport so the lens is never clipped by the popup
               window edge. */
            overflow-y: auto;
            overscroll-behavior: contain;
            display: none;
            /* Grows out of the field's bottom edge, so the origin sits where
               the lens is anchored rather than at its middle. */
            transform-origin: top center;
            animation: lens-in 0.3s cubic-bezier(0.2, 0.8, 0.3, 1);
        }
        .lens.show { display: block; }
        /* Same shape as the FAB's halo-enter: tighten in, overshoot a hair at
           ~55%, settle. Opacity finishes before the form does, so the sheet
           reads as focusing into place, not as sliding in. */
        @keyframes lens-in {
            0%   { opacity: 0; transform: translateY(-3px) scale(0.965); }
            55%  { opacity: 1; transform: translateY(0) scale(1.008); }
            100% { opacity: 1; transform: translateY(0) scale(1); }
        }

        .lens-item {
            position: relative;
            padding: 7px 12px;
            border-radius: var(--r-ctl);
            font-size: 13px;
            color: var(--ink-1);
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 10px;
            transition: background var(--t-color), color var(--t-color);
        }
        .lens-item:hover {
            background: var(--accent-soft);
            color: var(--accent-hover);
        }
        .lens-item.focused {
            background: var(--accent-soft);
            color: var(--accent-hover);
        }
        .lens-item.active {
            color: var(--accent-hover);
            font-weight: 500;
        }
        .lens-item.active .code { color: var(--accent); }
        .lens-item .code {
            font-family: var(--font-mono);
            font-size: 10px;
            color: var(--ink-4);
            letter-spacing: 0.06em;
            margin-left: auto;
        }

        /* ═══════ Custom ISO input (when "Other..." is picked) ═══════ */
        #customLangInputContainer {
            display: none;
            margin-top: 10px;
        }
        #customTargetLang {
            width: 100%;
            height: 32px;
            padding: 0 12px;
            font-family: var(--font-mono);
            font-size: 12px;
            letter-spacing: 0.02em;
            color: var(--ink-1);
            background: var(--glass-chip);
            backdrop-filter: var(--glass-blur);
            -webkit-backdrop-filter: var(--glass-blur);
            border: 1px solid transparent;
            border-radius: var(--r-ctl);
            outline: none;
            box-shadow: var(--sh-chip);
            transition: background var(--t-color), box-shadow var(--t-color);
        }
        /* Focus and error are drawn ON the glass — an inked edge over the
           specular plus the shared 滲み — not a hard full-alpha ring around
           it. A hard ring is the pit docs/FAB_UI_DESIGN.md §三 names: the chip
           stops being 硝子 for as long as the ring is up. 朱 draws the edge
           for the error and takes no bleed; only the signal ink glows. */
        #customTargetLang:focus {
            box-shadow:
                inset 0 0 0 1px var(--accent-rim),
                var(--sh-chip),
                0 0 8px 0 var(--accent-glow);
        }
        #customTargetLang.invalid {
            box-shadow:
                inset 0 0 0 1px var(--alert),
                var(--sh-chip);
            color: var(--alert);
        }
        .input-help {
            font-family: var(--font-mono);
            font-size: 10px;
            color: var(--ink-4);
            margin-top: 4px;
            text-align: right;
            letter-spacing: 0.04em;
        }

        /* ═══════ Toggle — glass pearl in a frosted channel ═══════
           label wraps native checkbox + visual pebble. Clicking anywhere
           on the label fires click on the input via standard HTML label
           behavior → native 'change' event → popup.js's listener saves.
           CSS ~ sibling selector drives the visual off the :checked state,
           which reflects programmatic .checked = X changes too. Zero JS. */
        .toggle-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            cursor: pointer;
            user-select: none;
        }
        .toggle-row > span {
            font-size: 13px;
            color: var(--ink-1);
        }
        .toggle {
            position: relative;
            width: 38px;
            height: 22px;
            border-radius: var(--r-pill);
            background: var(--glass-channel);
            backdrop-filter: var(--glass-blur);
            -webkit-backdrop-filter: var(--glass-blur);
            box-shadow: var(--sh-channel);
            transition: background var(--t-color), box-shadow var(--t-color);
            flex-shrink: 0;
        }
        .toggle::after {
            content: "";
            position: absolute;
            top: 2px;
            left: 2px;
            width: 18px;
            height: 18px;
            border-radius: 50%;
            background: var(--glass-pearl);
            box-shadow: var(--sh-pearl);
            transition: transform var(--t-release), background var(--t-color);
        }
        /* Drive visual off :checked — matches live state always */
        /* ON — the channel takes an ink wash, the pearl is inked 濃墨 and
           bleeds a soft 滲み. Exactly the FAB's active gesture at 22px, and
           like the FAB it carries no hue: the knob simply goes from frosted
           glass to wet ink. */
        .toggle-row input[type="checkbox"]:checked ~ .toggle {
            background: var(--accent-soft);
            box-shadow:
                inset 0 0 0 1px var(--accent-rim),
                inset 0 1px 3px rgba(var(--accent-rgb), 0.12),
                0 0 8px 0 var(--accent-glow);
        }
        .toggle-row input[type="checkbox"]:checked ~ .toggle::after {
            transform: translateX(16px);
            background: var(--accent);
            box-shadow:
                inset 0 1px 0 rgba(255, 255, 255, 0.3),
                0 0 0 0.5px rgba(var(--accent-rgb), 0.55),
                0 1px 3px rgba(var(--accent-rgb), 0.35);
        }
        /* Press = the pearl is pushed into its channel, in both states. Same
           asymmetry as the field and the ball: down on --t-press, back up on
           the spring in the base rule. The ratio is bigger than the field's
           because 18px needs it to read at all — the displacement lands in
           the same 1–3px band everything else moves in.
           Listed after the :checked rules so it wins in the ON state. */
        .toggle-row:active .toggle::after {
            transform: scale(0.92);
            transition: transform var(--t-press), background var(--t-color);
        }
        .toggle-row:active input[type="checkbox"]:checked ~ .toggle::after {
            transform: translateX(16px) scale(0.92);
            transition: transform var(--t-press), background var(--t-color);
        }

        /* Focus ring on the pebble when the hidden input is focused via keyboard */
        .toggle-row input[type="checkbox"]:focus-visible ~ .toggle {
            outline: 2px solid var(--accent);
            outline-offset: 2px;
        }

        /* ═══════ Footer ═══════ */
        .popup-foot {
            margin-top: 20px;
            padding-top: 14px;
            border-top: 1px solid var(--glass-line);
            display: flex;
            justify-content: center;
        }
        .popup-foot a {
            font-size: 12px;
            color: var(--ink-3);
            text-decoration: none;
            padding: 4px 8px;
            border-radius: var(--r-tight);
            transition: color var(--t-color), background var(--t-color);
            letter-spacing: 0.01em;
        }
        .popup-foot a:hover {
            color: var(--accent);
            background: var(--accent-soft);
        }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                transition-duration: 0.01ms !important;
                animation-duration: 0.01ms !important;
            }
        }
    </style>
</head>

<body class="pointer-scene">

    <!-- Popup panel -->
    <div class="paper popup">

        <header class="popup-head">
            <h2 data-i18n="popupTitle">Pointer</h2>
            <div class="tag">
                <span id="srcLangTag">AUTO</span>
                <span class="arrow">→</span>
                <span id="dstLangTag">ZH</span>
            </div>
        </header>

        <div class="popup-body">

            <div class="row">
                <label id="targetLangLabel" data-i18n="labelTargetLang">Target Language</label>
                <div class="field select" id="langField" tabindex="0" role="combobox"
                    aria-labelledby="targetLangLabel langFieldLabel" aria-haspopup="listbox"
                    aria-controls="langLens" aria-expanded="false">
                    <span id="langFieldLabel">中文</span>
                    <span class="lang-chip" id="langFieldChip">ZH</span>
                </div>
                <div class="lens" id="langLens" role="listbox" aria-labelledby="targetLangLabel" aria-hidden="true">
                    <div class="lens-item" id="lang-option-zh" role="option" aria-selected="false" data-value="zh">中文 · Chinese <span class="code">ZH</span></div>
                    <div class="lens-item" id="lang-option-en" role="option" aria-selected="false" data-value="en">English <span class="code">EN</span></div>
                    <div class="lens-item" id="lang-option-es" role="option" aria-selected="false" data-value="es">Español <span class="code">ES</span></div>
                    <div class="lens-item" id="lang-option-fr" role="option" aria-selected="false" data-value="fr">Français <span class="code">FR</span></div>
                    <div class="lens-item" id="lang-option-de" role="option" aria-selected="false" data-value="de">Deutsch <span class="code">DE</span></div>
                    <div class="lens-item" id="lang-option-ja" role="option" aria-selected="false" data-value="ja">日本語 · Japanese <span class="code">JA</span></div>
                    <div class="lens-item" id="lang-option-ko" role="option" aria-selected="false" data-value="ko">한국어 · Korean <span class="code">KO</span></div>
                    <div class="lens-item" id="lang-option-ru" role="option" aria-selected="false" data-value="ru">Русский · Russian <span class="code">RU</span></div>
                    <div class="lens-item" id="lang-option-pt" role="option" aria-selected="false" data-value="pt">Português <span class="code">PT</span></div>
                    <div class="lens-item" id="lang-option-it" role="option" aria-selected="false" data-value="it">Italiano <span class="code">IT</span></div>
                    <div class="lens-item" id="lang-option-other" role="option" aria-selected="false" data-value="other"><span data-i18n="optionOther">Other…</span> <span class="code">—</span></div>
                </div>
                <div id="customLangInputContainer">
                    <input type="text" id="customTargetLang" placeholder="e.g., ar, nl">
                    <div class="input-help" data-i18n="customLangHelp">ISO code</div>
                </div>
            </div>

            <label class="toggle-row">
                <span data-i18n="toggleDisplay">Show button</span>
                <input type="checkbox" id="showButton" class="native-hidden">
                <span class="toggle" aria-hidden="true"></span>
            </label>

        </div>

        <footer class="popup-foot">
            <a href="#" id="openOptions" data-i18n="settingsAdvanced">Advanced Settings</a>
        </footer>

    </div>

    <script src="settings.js"></script>
    <script src="i18n.js"></script>
    <script src="popup.js"></script>

</body>

</html>
