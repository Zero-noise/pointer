<!DOCTYPE html>
<html>

<head>
    <title>Pointer</title>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="theme.css">
    <style>
        /* Popup-specific layout; shared material tokens live in theme.css.
           Native checkbox semantics drive the visual toggle. */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            width: 290px;
            padding: 22px 22px 18px;
            font-size: 13px;
            line-height: 1.5;
        }

        /* Keep label-to-input click behavior while hiding the native checkbox. */
        .native-hidden {
            position: absolute !important;
            width: 1px !important;
            height: 1px !important;
            opacity: 0 !important;
            left: -9999px !important;
            top: 0 !important;
        }

        .paper.popup {
            position: relative;
            z-index: 1;
            width: auto;
            padding: 0;
            background: transparent;
            border-radius: 0;
            box-shadow: none;
        }

        .popup-head {
            display: flex;
            align-items: baseline;
            justify-content: space-between;
            padding-bottom: 16px;
            margin-bottom: 18px;
            border-bottom: 1px solid var(--glass-line);
        }
        .popup-head h2 {
            font-size: 13px;
            font-weight: 600;
            color: var(--ink-1);
            letter-spacing: 0.005em;
        }
        .popup-head .tag {
            font-family: var(--font-mono);
            font-size: 10px;
            color: var(--ink-4);
            letter-spacing: 0.08em;
        }
        .popup-head .tag .arrow {
            color: var(--accent);
            margin: 0 3px;
        }

        .popup-body {
            display: flex;
            flex-direction: column;
            gap: 18px;
        }

        .row {
            display: flex;
            flex-direction: column;
            gap: 8px;
            position: relative;
        }
        .row > label {
            font-size: 12px;
            font-weight: 500;
            color: var(--ink-2);
            letter-spacing: 0.005em;
        }

        /* Tune field press displacement in pixels rather than reusing the FAB ratio. */
        .field {
            width: 100%;
            padding: 11px 14px;
            font-size: 13px;
            color: var(--ink-1);
            background: var(--glass-chip);
            backdrop-filter: var(--glass-blur);
            -webkit-backdrop-filter: var(--glass-blur);
            border: none;
            border-radius: var(--r-field);
            outline: none;
            box-shadow: var(--sh-chip);
            transition: background var(--t-color), box-shadow var(--t-color),
                        transform var(--t-release);
            cursor: pointer;
            user-select: none;
            font-family: inherit;
        }
        .field:hover {
            transform: translateY(-1px);
            background: var(--glass-chip-hover);
            box-shadow: var(--sh-chip-hover);
        }
        /* Fast press; the base spring handles release. */
        .field:active {
            transform: scale(0.99);
            box-shadow: var(--sh-chip-press);
            transition: transform var(--t-press), box-shadow var(--t-press);
        }
        /* aria-expanded is the visual source of truth for the open combobox. */
        .field[aria-expanded="true"] {
            background: var(--glass-chip-hover);
            box-shadow:
                inset 0 0 0 1px var(--accent-rim),
                var(--sh-chip),
                0 0 8px 0 var(--accent-glow);
        }
        /* Match the open-state specificity so pressing it still collapses the shadow. */
        .field[aria-expanded="true"]:active {
            box-shadow:
                inset 0 0 0 1px var(--accent-rim),
                var(--sh-chip-press);
        }
        .field:focus-visible {
            outline: 2px solid var(--accent);
            outline-offset: 2px;
        }

        .field.select {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .field.select > span:first-child {
            flex: 1;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .lang-chip {
            font-family: var(--font-mono);
            font-size: 11px;
            color: var(--ink-3);
            letter-spacing: 0.04em;
            flex-shrink: 0;
        }

        /* Fixed positioning avoids stretching the Chrome popup; JS supplies its bounds. */
        .lens {
            position: fixed;
            padding: 5px;
            z-index: 20;
            border-radius: var(--r-field);
            background: var(--glass-float);
            backdrop-filter: var(--glass-blur);
            -webkit-backdrop-filter: var(--glass-blur);
            box-shadow: var(--sh-float);
            /* popup.js constrains max-height to the current viewport. */
            overflow-y: auto;
            overscroll-behavior: contain;
            display: none;
            transform-origin: top center;
            animation: lens-in 0.3s cubic-bezier(0.2, 0.8, 0.3, 1);
        }
        .lens.show { display: block; }
        @keyframes lens-in {
            0%   { opacity: 0; transform: translateY(-3px) scale(0.965); }
            55%  { opacity: 1; transform: translateY(0) scale(1.008); }
            100% { opacity: 1; transform: translateY(0) scale(1); }
        }

        .lens-item {
            position: relative;
            padding: 7px 12px;
            border-radius: var(--r-ctl);
            font-size: 13px;
            color: var(--ink-1);
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 10px;
            transition: background var(--t-color), color var(--t-color);
        }
        .lens-item:hover {
            background: var(--accent-soft);
            color: var(--accent-hover);
        }
        .lens-item.focused {
            background: var(--accent-soft);
            color: var(--accent-hover);
        }
        .lens-item.active {
            color: var(--accent-hover);
            font-weight: 500;
        }
        .lens-item.active .code { color: var(--accent); }
        .lens-item .code {
            font-family: var(--font-mono);
            font-size: 10px;
            color: var(--ink-4);
            letter-spacing: 0.06em;
            margin-left: auto;
        }

        /* Custom ISO input for “Other…”. */
        #customLangInputContainer {
            display: none;
            margin-top: 10px;
        }
        #customTargetLang {
            width: 100%;
            height: 32px;
            padding: 0 12px;
            font-family: var(--font-mono);
            font-size: 12px;
            letter-spacing: 0.02em;
            color: var(--ink-1);
            background: var(--glass-chip);
            backdrop-filter: var(--glass-blur);
            -webkit-backdrop-filter: var(--glass-blur);
            border: 1px solid transparent;
            border-radius: var(--r-ctl);
            outline: none;
            box-shadow: var(--sh-chip);
            transition: background var(--t-color), box-shadow var(--t-color);
        }
        /* Focus and invalid states overlay the glass without replacing its base shadow. */
        #customTargetLang:focus {
            box-shadow:
                inset 0 0 0 1px var(--accent-rim),
                var(--sh-chip),
                0 0 8px 0 var(--accent-glow);
        }
        #customTargetLang.invalid {
            box-shadow:
                inset 0 0 0 1px var(--alert),
                var(--sh-chip);
            color: var(--alert);
        }
        .input-help {
            font-family: var(--font-mono);
            font-size: 10px;
            color: var(--ink-4);
            margin-top: 4px;
            text-align: right;
            letter-spacing: 0.04em;
        }

        /* The native checkbox remains the source of truth for the visual toggle. */
        .toggle-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            cursor: pointer;
            user-select: none;
        }
        .toggle-row > span {
            font-size: 13px;
            color: var(--ink-1);
        }
        .toggle {
            position: relative;
            width: 38px;
            height: 22px;
            border-radius: var(--r-pill);
            background: var(--glass-channel);
            backdrop-filter: var(--glass-blur);
            -webkit-backdrop-filter: var(--glass-blur);
            box-shadow: var(--sh-channel);
            transition: background var(--t-color), box-shadow var(--t-color);
            flex-shrink: 0;
        }
        .toggle::after {
            content: "";
            position: absolute;
            top: 2px;
            left: 2px;
            width: 18px;
            height: 18px;
            border-radius: 50%;
            background: var(--glass-pearl);
            box-shadow: var(--sh-pearl);
            transition: transform var(--t-release), background var(--t-color);
        }
        .toggle-row input[type="checkbox"]:checked ~ .toggle {
            background: var(--accent-soft);
            box-shadow:
                inset 0 0 0 1px var(--accent-rim),
                inset 0 1px 3px rgba(var(--accent-rgb), 0.12),
                0 0 8px 0 var(--accent-glow);
        }
        .toggle-row input[type="checkbox"]:checked ~ .toggle::after {
            transform: translateX(16px);
            background: var(--accent);
            box-shadow:
                inset 0 1px 0 rgba(255, 255, 255, 0.3),
                0 0 0 0.5px rgba(var(--accent-rgb), 0.55),
                0 1px 3px rgba(var(--accent-rgb), 0.35);
        }
        /* Listed after :checked so pressed transforms win in both states. */
        .toggle-row:active .toggle::after {
            transform: scale(0.92);
            transition: transform var(--t-press), background var(--t-color);
        }
        .toggle-row:active input[type="checkbox"]:checked ~ .toggle::after {
            transform: translateX(16px) scale(0.92);
            transition: transform var(--t-press), background var(--t-color);
        }

        /* Expose keyboard focus on the visual toggle. */
        .toggle-row input[type="checkbox"]:focus-visible ~ .toggle {
            outline: 2px solid var(--accent);
            outline-offset: 2px;
        }

        .popup-foot {
            margin-top: 20px;
            padding-top: 14px;
            border-top: 1px solid var(--glass-line);
            display: flex;
            justify-content: center;
        }
        .popup-foot a {
            font-size: 12px;
            color: var(--ink-3);
            text-decoration: none;
            padding: 4px 8px;
            border-radius: var(--r-tight);
            transition: color var(--t-color), background var(--t-color);
            letter-spacing: 0.01em;
        }
        .popup-foot a:hover {
            color: var(--accent);
            background: var(--accent-soft);
        }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                transition-duration: 0.01ms !important;
                animation-duration: 0.01ms !important;
            }
        }
    </style>
</head>

<body class="pointer-scene">

    <div class="paper popup">

        <header class="popup-head">
            <h2 data-i18n="popupTitle">Pointer</h2>
            <div class="tag">
                <span id="srcLangTag">AUTO</span>
                <span class="arrow">→</span>
                <span id="dstLangTag">ZH</span>
            </div>
        </header>

        <div class="popup-body">

            <div class="row">
                <label id="targetLangLabel" data-i18n="labelTargetLang">Target Language</label>
                <div class="field select" id="langField" tabindex="0" role="combobox"
                    aria-labelledby="targetLangLabel langFieldLabel" aria-haspopup="listbox"
                    aria-controls="langLens" aria-expanded="false">
                    <span id="langFieldLabel">中文</span>
                    <span class="lang-chip" id="langFieldChip">ZH</span>
                </div>
                <div class="lens" id="langLens" role="listbox" aria-labelledby="targetLangLabel" aria-hidden="true">
                    <div class="lens-item" id="lang-option-zh" role="option" aria-selected="false" data-value="zh">中文 · Chinese <span class="code">ZH</span></div>
                    <div class="lens-item" id="lang-option-en" role="option" aria-selected="false" data-value="en">English <span class="code">EN</span></div>
                    <div class="lens-item" id="lang-option-es" role="option" aria-selected="false" data-value="es">Español <span class="code">ES</span></div>
                    <div class="lens-item" id="lang-option-fr" role="option" aria-selected="false" data-value="fr">Français <span class="code">FR</span></div>
                    <div class="lens-item" id="lang-option-de" role="option" aria-selected="false" data-value="de">Deutsch <span class="code">DE</span></div>
                    <div class="lens-item" id="lang-option-ja" role="option" aria-selected="false" data-value="ja">日本語 · Japanese <span class="code">JA</span></div>
                    <div class="lens-item" id="lang-option-ko" role="option" aria-selected="false" data-value="ko">한국어 · Korean <span class="code">KO</span></div>
                    <div class="lens-item" id="lang-option-ru" role="option" aria-selected="false" data-value="ru">Русский · Russian <span class="code">RU</span></div>
                    <div class="lens-item" id="lang-option-pt" role="option" aria-selected="false" data-value="pt">Português <span class="code">PT</span></div>
                    <div class="lens-item" id="lang-option-it" role="option" aria-selected="false" data-value="it">Italiano <span class="code">IT</span></div>
                    <div class="lens-item" id="lang-option-other" role="option" aria-selected="false" data-value="other"><span data-i18n="optionOther">Other…</span> <span class="code">—</span></div>
                </div>
                <div id="customLangInputContainer">
                    <input type="text" id="customTargetLang" placeholder="e.g., ar, nl">
                    <div class="input-help" data-i18n="customLangHelp">ISO code</div>
                </div>
            </div>

            <label class="toggle-row">
                <span data-i18n="toggleDisplay">Show button</span>
                <input type="checkbox" id="showButton" class="native-hidden">
                <span class="toggle" aria-hidden="true"></span>
            </label>

        </div>

        <footer class="popup-foot">
            <a href="#" id="openOptions" data-i18n="settingsAdvanced">Advanced Settings</a>
        </footer>

    </div>

    <script src="settings.js"></script>
    <script src="i18n.js"></script>
    <script src="popup.js"></script>

</body>

</html>
